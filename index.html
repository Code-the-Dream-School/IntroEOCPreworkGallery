<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Work Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 14 14"><polygon points="7,1 13,4 13,10 7,13 1,10 1,4"/></svg>
      </div>
      <h1>Student Work Gallery</h1>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="header-meta">Accepted submissions</span>
      <span class="count-badge" id="count-badge">— sketches</span>
    </div>
  </header>

  <div class="main">

    <!-- ── LEFT PANEL ── -->
    <aside class="panel" aria-label="Sketch list">
      <div class="panel-header">
        <span class="panel-heading">Student sketches</span>
      </div>
      <div class="panel-list" id="panel-list" role="list">
        <!-- populated by gallery.js -->
      </div>
    </aside>

    <!-- ── RIGHT STAGE ── -->
    <main class="stage" aria-label="Sketch viewer">

      <!-- empty placeholder -->
      <div class="stage-empty" id="stage-empty" aria-live="polite">
        <svg class="big-icon" viewBox="0 0 80 80" role="img" aria-label="Play icon">
          <rect x="10" y="10" width="60" height="60" rx="6"/>
          <polygon points="32,28 56,40 32,52"/>
        </svg>
        <p>Select a sketch from the panel<br>to view and interact with it.</p>
      </div>

      <!-- active sketch view -->
      <div class="stage-content" id="stage-content">

        <div class="stage-bar">
          <span class="stage-title" id="stage-title" aria-live="polite">—</span>
          <div class="stage-right">
            <span class="stage-hint">
              <span class="hint-dot" aria-hidden="true"></span>
              Live &amp; interactive
            </span>
            <div class="nav-controls" role="group" aria-label="Navigate sketches">
              <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled aria-label="Previous sketch">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <button class="nav-btn" id="next-btn" onclick="navigate(1)"  disabled aria-label="Next sketch">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="stage-frame">
          <iframe id="stage-iframe"
                  title="Student sketch"
                  allow="autoplay"
                  sandbox="allow-scripts allow-same-origin">
          </iframe>
          <div class="loading-bar" id="loading-bar" aria-hidden="true"></div>
        </div>

        <span class="stage-counter" id="stage-counter" aria-live="polite">—</span>

      </div>
    </main>

  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
